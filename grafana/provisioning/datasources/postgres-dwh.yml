apiVersion: 1

datasources:
  - name: PostgreSQL DWH
    type: postgres
    access: proxy
    url: postgres-dwh:5432
    database: postgres
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      sslmode: disable
      maxOpenConns: 100
      maxIdleConns: 100
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: false
    isDefault: true
    editable: true

