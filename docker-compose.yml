# поднимаю master и replica
version: "3.9"

services:
  postgres-master:
    image: postgres:15 # образ postgres
    container_name: hw1-postgres-master # имя контейнера
    restart: always # restart always
    environment:
      POSTGRES_USER: postgres # пользователь
      POSTGRES_PASSWORD: postgres # пароль
    ports:
      - "2222:5432" # порты для мастера (хост:порт)
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./replica_data:/var/lib/postgresql/data-replica
      - ./init-script/common-config/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./init-script/common-config/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./init-script/sql:/docker-entrypoint-initdb.d  # Автоматический запуск всех SQL скриптов
      - ./init-script:/etc/postgresql/init-script
      - ./init-script/sql/09_debezium_setup.sql:/etc/postgresql/init-script/sql/09_debezium_setup.sql
      # Явное монтирование скриптов генерации данных для гарантированного выполнения
      - ./init-script/sql/11_user_service_data.sql:/docker-entrypoint-initdb.d/11_user_service_data.sql
      - ./init-script/sql/12_order_service_data.sql:/docker-entrypoint-initdb.d/12_order_service_data.sql
      - ./init-script/sql/13_logistics_service_data.sql:/docker-entrypoint-initdb.d/13_logistics_service_data.sql
      # Монтирование CSV файлов для загрузки данных
      - ./mock_data:/var/lib/postgresql/mock_data

    command: # настройка реплики и логического декодирования для Debezium
      postgres -c wal_level=logical
               -c max_wal_senders=10
               -c max_replication_slots=10
               -c wal_keep_size=64
               -c listen_addresses='*'
               -c hot_standby=on

  postgres-replica:
    image: postgres:15 # образ postgres
    container_name: hw1-postgres-replica # имя контейнера
    restart: always # restart always
    environment:
      POSTGRES_USER: postgres # пользователь
      POSTGRES_PASSWORD: postgres # пароль
    ports:
      - "5433:5432" # порты для реплики
    volumes:
      - ./replica_data:/var/lib/postgresql/data # данные реплики
      # postgresql.conf уже есть в replica_data от pg_basebackup, не нужно монтировать отдельно
      - ./init-script/common-config/pg_hba.conf:/etc/postgresql/pg_hba.conf

    depends_on:
      - postgres-master # зависит от мастера
    command:
      postgres -c hot_standby=on

  postgres-dwh:
    image: postgres:15 # образ postgres
    container_name: hw1-postgres-dwh # имя контейнера DWH
    restart: always # restart always
    environment:
      POSTGRES_USER: postgres # пользователь
      POSTGRES_PASSWORD: postgres # пароль
    ports:
      - "5434:5432" # порты для DWH
    volumes:
      - ./dwh_data:/var/lib/postgresql/data # данные DWH
      - ./init-script/common-config/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./init-script/common-config/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./init-script/sql/07_dwh_detailed_ddl.sql:/docker-entrypoint-initdb.d/07_dwh_detailed_ddl.sql # DDL для DWH
      - ./init-script/sql/08_dwh_init_source_systems.sql:/docker-entrypoint-initdb.d/08_dwh_init_source_systems.sql # Инициализация систем-источников
      - ./init-script/sql/14_presentation_schema.sql:/docker-entrypoint-initdb.d/14_presentation_schema.sql # Схема presentation для витрин

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: hw1-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: hw1-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  debezium-connect:
    image: debezium/connect:2.5
    container_name: hw1-debezium-connect
    restart: always
    depends_on:
      - kafka
      - postgres-master
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    volumes:
      - ./debezium/connectors:/kafka/connect/debezium-connectors

  dmp-service:
    build: ./dmp-service
    container_name: hw1-dmp-service
    restart: always
    depends_on:
      - kafka
      - postgres-dwh
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PREFIX: postgres-master  # Подписывается на все топики: postgres-master.*, postgres-master-order.*, postgres-master-logistics.*
      KAFKA_CONSUMER_GROUP: dmp-service-group
      DWH_HOST: postgres-dwh
      DWH_PORT: 5432
      DWH_DATABASE: postgres
      DWH_USER: postgres
      DWH_PASSWORD: postgres
    volumes:
      - ./dmp-service:/app
    command: python main.py

  # =====================================================
  # Apache Airflow Services
  # =====================================================
  
  postgres-airflow:
    image: postgres:15
    container_name: hw1-postgres-airflow
    restart: always
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5435:5432"
    volumes:
      - ./airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.8.0
    container_name: hw1-airflow-init
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
    user: "${AIRFLOW_UID:-50000}:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        function ver() {
          printf "%04d%04d%04d%04d" $${1//./ }
        }
        airflow version
        if [[ -z "$${AIRFLOW__CORE__FERNET_KEY}" ]]; then
          export AIRFLOW__CORE__FERNET_KEY=$$(python -c "from cryptography.fernet import Fernet; F = Fernet.generate_key(); print(F.decode())")
        fi
        airflow db init
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
    healthcheck:
      test: ["CMD", "airflow", "version"]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-webserver:
    image: apache/airflow:2.8.0
    container_name: hw1-airflow-webserver
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
      postgres-dwh:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
    ports:
      - "8080:8080"
    user: "${AIRFLOW_UID:-50000}:0"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    image: apache/airflow:2.8.0
    container_name: hw1-airflow-scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
      postgres-dwh:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
    user: "${AIRFLOW_UID:-50000}:0"
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "scheduler", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 5

  # =====================================================
  # Grafana Services
  # =====================================================
  
  grafana:
    image: grafana/grafana:latest
    container_name: hw1-grafana
    restart: always
    depends_on:
      - postgres-dwh
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

# ./init — папка, где лежат sql-миграции, которые автоматически применятся при старте мастера.
# master_data и replica_data — чтобы хранить данные отдельно.
# dwh_data — данные для DWH.
# debezium/connectors — конфигурации Debezium connectors
# dmp-service — сервис для загрузки данных из Kafka в DWH
# airflow/ — папка с DAGs, логами, плагинами и конфигурацией Airflow
# airflow_data/ — данные PostgreSQL для метаданных Airflow